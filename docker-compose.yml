services:
  api:
    build: src/QubicaMultiplex.Catalog.Api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Catalog: "Host=db;Port=5432;Database=postgres;Username=postgres;Password=postgres"

  booking:
    build: src/QubicaMultiplex.Booking.Api
    ports:
      - "8081:8080"

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
